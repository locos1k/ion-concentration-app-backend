services:
  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  postgres:
    container_name: solutions_db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: solutions_user
      POSTGRES_PASSWORD: solutions_password
      POSTGRES_DB: solutions_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  adminer:
    container_name: solutions_adminer
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
  postgres-data:
